[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
authors = [
    { email = "johannes.programming@gmail.com", name = "Johannes" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2,<3",
]
description = "This project is a small collection of functions that check arguments for being na-values."
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
name = "na_quantors"
readme = "README.rst"
requires-python = ">=3.11"
version = "1.1.0"

[project.urls]
Download = "https://pypi.org/project/na-quantors/#files"
Index = "https://pypi.org/project/na_quantors/"
Source = "https://github.com/johannes-programming/na_quantors/"
Website = "https://na-quantors.johannes-programming.online/"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
